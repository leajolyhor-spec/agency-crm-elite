<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCRM - Production Cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#0b0f19',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                            500: '#64748b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        .ambient-glow { box-shadow: 0 0 50px -10px rgba(59, 130, 246, 0.15); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen">

    <div class="lg:hidden flex items-center justify-between p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center p-1.5 shadow-lg shadow-blue-500/20">
                <i data-lucide="layers" class="w-full h-full text-white"></i>
            </div>
            <span class="font-display font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Agency Elite</span>
        </div>
        <button id="mobile-menu-btn" class="p-2 text-slate-400 hover:text-white focus:outline-none">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

    <div class="flex min-h-screen relative">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:h-screen">
            <div class="p-6 hidden lg:flex items-center gap-3 border-b border-slate-800/50">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center p-2 shadow-lg shadow-blue-500/20">
                    <i data-lucide="layers" class="w-full h-full text-white"></i>
                </div>
                <span class="font-display font-bold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Agency Elite</span>
            </div>
            
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto no-scrollbar">
                <button onclick="switchView('dashboard')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200" data-view="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Tableau de bord
                </button>
                <button onclick="switchView('leads')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200" data-view="leads">
                    <i data-lucide="users" class="w-5 h-5"></i> Opportunités (Leads)
                </button>
                <button onclick="switchView('pipeline')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200" data-view="pipeline">
                    <i data-lucide="git-kanban" class="w-5 h-5"></i> Pipeline Kanban
                </button>
                <button onclick="switchView('planning')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200" data-view="planning">
                    <i data-lucide="calendar" class="w-5 h-5"></i> Planning / Agenda
                </button>
                <button onclick="switchView('invoices')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200" data-view="invoices">
                    <i data-lucide="file-text" class="w-5 h-5"></i> Facturation & PDF
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800/50 bg-slate-900/50 relative">
                <div id="profile-dropdown" class="absolute bottom-20 left-4 right-4 bg-slate-800 border border-slate-700 p-2 rounded-xl shadow-xl hidden z-50 space-y-1">
                    <p class="text-xs text-slate-400 px-2 py-1">Changer de compte :</p>
                    <button onclick="changeUser('Léa Joly', 'Chef de Projet Senior', 'LJ', 'bg-blue-600')" class="w-full text-left text-sm px-2 py-1.5 rounded-lg hover:bg-slate-700/60 flex items-center gap-2 text-white">
                        <span class="w-6 h-6 rounded bg-blue-600 text-[10px] font-bold flex items-center justify-center">LJ</span> Léa Joly
                    </button>
                    <button onclick="changeUser('Directeur Agence', 'Admin Principal', 'DA', 'bg-purple-600')" class="w-full text-left text-sm px-2 py-1.5 rounded-lg hover:bg-slate-700/60 flex items-center gap-2 text-slate-300">
                        <span class="w-6 h-6 rounded bg-purple-600 text-[10px] font-bold flex items-center justify-center">DA</span> Le Boss
                    </button>
                </div>
                
                <div onclick="toggleProfileMenu()" class="flex items-center gap-3 p-2 rounded-xl bg-slate-800/40 border border-slate-700/30 hover:bg-slate-800/80 transition cursor-pointer">
                    <div id="user-avatar" class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-inner">LJ</div>
                    <div class="flex-1 min-w-0">
                        <p id="user-name" class="text-sm font-semibold text-slate-200 truncate">Léa Joly</p>
                        <p id="user-role" class="text-xs text-slate-400 truncate">Chef de Projet Senior</p>
                    </div>
                    <i data-lucide="chevrons-up-down" class="w-4 h-4 text-slate-500"></i>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

        <main class="flex-1 p-4 lg:p-8 overflow-x-hidden w-full bg-slate-950">
            <div id="content-area" class="max-w-7xl mx-auto space-y-6"></div>
        </main>
    </div>

    <script>
        // Data LocalStorage
        let leads = JSON.parse(localStorage.getItem('crm_leads')) || [
            { id: 1, name: "Acme Corp", contact: "Thomas Martin", budget: "15 000 €", status: "Proposition" },
            { id: 2, name: "Global Tech", contact: "Sophie Lucas", budget: "8 500 €", status: "Nouveau" },
            { id: 3, name: "E-Commerce Enterprise", contact: "Marc Pivot", budget: "32 000 €", status: "Gagné" }
        ];

        let tasks = JSON.parse(localStorage.getItem('crm_tasks')) || [
            { id: 1, title: "Rendez-vous démo Acme Corp", date: "2026-05-30", time: "10:30", type: "Client" },
            { id: 2, title: "Relance Facture Global Tech", date: "2026-06-02", time: "14:00", type: "Interne" }
        ];

        function saveData() {
            localStorage.setItem('crm_leads', JSON.stringify(leads));
            localStorage.setItem('crm_tasks', JSON.stringify(tasks));
        }

        // Hamburger Menu Logic
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleMobileMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        if(overlay) overlay.addEventListener('click', toggleMobileMenu);

        // Profile Switcher Logic
        function toggleProfileMenu() {
            document.getElementById('profile-dropdown').classList.toggle('hidden');
        }
        function changeUser(name, role, initials, colorClass) {
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-role').innerText = role;
            document.getElementById('user-avatar').innerText = initials;
            document.getElementById('user-avatar').className = `w-9 h-9 rounded-xl flex items-center justify-center font-bold text-white shadow-inner ${colorClass}`;
            toggleProfileMenu();
        }

        // Router / Tabs Switcher
        function switchView(viewName) {
            const content = document.getElementById('content-area');
            if(!sidebar.classList.contains('-translate-x-full')) toggleMobileMenu();

            document.querySelectorAll('.nav-item').forEach(item => {
                if(item.getAttribute('data-view') === viewName) {
                    item.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 bg-blue-600/10 text-blue-400 border border-blue-500/20";
                } else {
                    item.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200";
                }
            });

            if(viewName === 'dashboard') {
                content.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-2xl lg:text-3xl font-display font-bold text-white">Tableau de bord</h1>
                            <p class="text-slate-400 text-sm">Performances globales de l'agence.</p>
                        </div>
                        <button onclick="alert('Analyse IA lancée sur le pipeline...')" class="bg-blue-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md self-start hover:bg-blue-700 transition">Assistant IA</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl ambient-glow">
                            <p class="text-slate-400 text-sm font-medium">Chiffre d'Affaires</p>
                            <p class="text-3xl font-display font-bold mt-2 text-white">55 750 €</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <p class="text-slate-400 text-sm font-medium">Opportunités Actives</p>
                            <p class="text-3xl font-display font-bold mt-2 text-white">${leads.length}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl sm:col-span-2 lg:col-span-1">
                            <p class="text-slate-400 text-sm font-medium">Taux de Conversion</p>
                            <p class="text-3xl font-display font-bold mt-2 text-white">74%</p>
                        </div>
                    </div>
                `;
            } else if(viewName === 'leads') {
                let rows = leads.map(l => `
                    <tr class="border-b border-slate-800/40 hover:bg-slate-800/20 transition">
                        <td class="p-4 text-white font-medium whitespace-nowrap">${l.name}</td>
                        <td class="p-4 text-slate-300 whitespace-nowrap">${l.contact}</td>
                        <td class="p-4 text-slate-300 whitespace-nowrap">${l.budget}</td>
                        <td class="p-4 whitespace-nowrap"><span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">${l.status}</span></td>
                    </tr>
                `).join('');
                content.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-display font-bold text-white">Opportunités</h2>
                        <button onclick="addLeadPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 transition"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Ajouter</button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden overflow-x-auto no-scrollbar shadow-xl">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-800 bg-slate-900/50">
                                    <th class="p-4 text-slate-400 font-medium text-xs tracking-wider uppercase">Entreprise</th>
                                    <th class="p-4 text-slate-400 font-medium text-xs tracking-wider uppercase">Contact</th>
                                    <th class="p-4 text-slate-400 font-medium text-xs tracking-wider uppercase">Budget</th>
                                    <th class="p-4 text-slate-400 font-medium text-xs tracking-wider uppercase">Statut</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/30">${rows}</tbody>
                        </table>
                    </div>
                `;
            } else if(viewName === 'pipeline') {
                content.innerHTML = `
                    <h2 class="text-2xl font-display font-bold text-white mb-4">Pipeline Kanban</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl">
                            <h3 class="text-sm font-semibold text-slate-300 mb-3">À Contacter</h3>
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-md">
                                <p class="text-sm font-bold text-white">Global Tech</p>
                                <p class="text-xs text-slate-400 mt-1">Budget : 8 500 €</p>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl">
                            <h3 class="text-sm font-semibold text-slate-300 mb-3">Proposition</h3>
                            <div class="bg-slate-900 border border-blue-900 p-4 rounded-xl shadow-md">
                                <p class="text-sm font-bold text-white">Acme Corp</p>
                                <p class="text-xs text-slate-400 mt-1">Budget : 15 000 €</p>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl">
                            <h3 class="text-sm font-semibold text-slate-300 mb-3">Gagné</h3>
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-md">
                                <p class="text-sm font-bold text-white">E-Commerce Enterprise</p>
                                <p class="text-xs text-slate-400 mt-1">Budget : 32 000 €</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if(viewName === 'planning') {
                let agendaItems = tasks.map(t => `
                    <div class="flex items-center justify-between p-3.5 bg-slate-950 border border-slate-800/80 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full ${t.type === 'Client' ? 'bg-blue-500' : 'bg-purple-500'}"></div>
                            <div>
                                <p class="text-sm font-medium text-white">${t.title}</p>
                                <p class="text-xs text-slate-500 mt-0.5">${t.date} à ${t.time}</p>
                            </div>
                        </div>
                        <span class="text-xs bg-slate-900 text-slate-400 px-2.5 py-1 rounded-lg border border-slate-800">${t.type}</span>
                    </div>
                `).join('');
                content.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h2 class="text-2xl font-display font-bold text-white">Planning / Agenda</h2>
                        <button onclick="addTaskPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 transition"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Ajouter</button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 shadow-xl">${agendaItems}</div>
                `;
            } else if(viewName === 'invoices') {
                content.innerHTML = `
                    <h2 class="text-2xl font-display font-bold text-white mb-2">Facturation & PDF</h2>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 shadow-xl max-w-xl">
                        <h3 class="text-lg font-bold text-white border-b border-slate-800 pb-2">Rapport Financier Agence</h3>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between"><span class="text-slate-400">Total Facturé :</span><span class="text-emerald-400 font-bold">55 750,00 €</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">Statut fiscal :</span><span class="text-blue-400">À jour</span></div>
                        </div>
                        <button onclick="generatePDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition shadow-lg mt-2">
                            <i data-lucide="download" class="w-4 h-4"></i> Générer le PDF
                        </button>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function addLeadPrompt() {
            let name = prompt("Nom de l'entreprise :");
            let contact = prompt("Nom du contact :");
            let budget = prompt("Budget (ex: 10 000 €) :");
            if(name && contact && budget) {
                leads.push({ id: Date.now(), name, contact, budget, status: "Nouveau" });
                saveData(); switchView('leads');
            }
        }

        function addTaskPrompt() {
            let title = prompt("Intitulé du rendez-vous :");
            let time = prompt("Heure (ex: 15:00) :");
            if(title && time) {
                tasks.push({ id: Date.now(), title, date: "2026-05-29", time, type: "Client" });
                saveData(); switchView('planning');
            }
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("AGENCY ELITE - RAPPORT CRM COMPLET", 14, 20);
            doc.text("Chiffre d'affaires global: 55 750,00 EUR", 14, 30);
            doc.save("rapport-agency-elite.pdf");
        }

        switchView('dashboard');
    </script>
</body>
</html>
