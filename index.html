        function formatSimpleDate(timestampOrString) {
            try {
                const date = new Date(timestampOrString);
                return date.toISOString().split('T')[0];
            } catch (err) {
                return String(timestampOrString);
            }
        }

        function App() {
            const [view, setView] = useState('dashboard');
            const [leads, setLeads] = useState(() => {
                const saved = localStorage.getItem('standalone_leads');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 's-1',
                        companyName: 'Acme Corp',
                        contactName: 'Thomas Martin',
                        email: 't.martin@acme.com',
                        need: 'Refonte globale du site web grand public et plateforme E-Commerce sous Next.js',
                        budget: 15000,
                        temperature: 'Chaud',
                        status: 'Won',
                        serviceType: 'Web',
                        createdAt: Date.now() - 86400000 * 15,
                        documents: [{ id: 'doc-1', name: 'Charte Graphique.pdf', type: 'PDF', date: '2026-05-10' }],
                        projectStatus: 'Développement',
                        projectProgress: 45,
                        deliveryDate: '2026-07-20',
                        clientNotes: [
                            { id: 'cn-1', text: 'Réunion de cadrage validée. Maquettes Figma approuvées.', date: '2026-05-18 10:30', author: 'Léa Joly' },
                            { id: 'cn-2', text: 'Configuration initiale de TypeScript, Tailwind v4 et routes de l\'application.', date: '2026-05-22 15:45', author: 'Thibaut Mercier' }
                        ]

                    {
                        id: 's-2',
                        companyName: 'Starlight Agency',
                        contactName: 'Marie Curie',
                        email: 'm.curie@starlight.io',
                        need: 'Audit de mots-clés SEO complet & Campagnes Google Ads optimisées',
                        budget: 5000,
                        temperature: 'Tiède',
                        status: 'Won',
                        serviceType: 'SEO',
                        createdAt: Date.now() - 86400000 * 8,
                        documents: [],
                        projectStatus: 'Cadrage',
                        projectProgress: 15,
                        deliveryDate: '2026-06-15',
                        clientNotes: [
                            { id: 'cn-3', text: 'Analyses concurrentielles SEO terminées. Identification des opportunités clés.', date: '2026-05-24 11:15', author: 'Léa Joly' }
                        ]
                    },
                    {
                        id: 's-3',
                        companyName: 'GlobalTech Ltd',
                        contactName: 'Alan Turing',
                        email: 'a.turing@globaltech.com',
                        need: 'Audit infrastructure sécurité pour conformité RGPD & Migration Cloud AWS',
                        budget: 25000,
                        temperature: 'Froid',
                        status: 'Qualified',
                        serviceType: 'Consulting',
                        createdAt: Date.now() - 86400000 * 20,
                        documents: [],

                        projectProgress: 0,
                        deliveryDate: '2026-08-30',
                        clientNotes: []
                    }
                ];
            });

                const saved = localStorage.getItem('standalone_invoices');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 'INV-1024',
                        leadId: 's-1',
                        companyName: 'Acme Corp',
                        amount: 15000,
                        status: 'Pending',
                        dueDate: '2026-06-15',
                        createdAt: Date.now() - 86400000 * 5,
                    },
                    {
                        id: 'INV-1023',
                        leadId: 's-2',
                        companyName: 'Starlight Agency',
                        amount: 5000,

                        createdAt: Date.now() - 86400000 * 8,

            const [actions, setActions] = useState(() => {

                const wonLeads = leads.filter(l => l.status === 'Won');

            }, [leads, invoices]);

            // --- PDF generation triggers ---

                                setIsProfileSwitcherOpen(true);
                                setIsMobileMenuOpen(false);
                            }}
                            className="p-4 bg-slate-950/80 border-t border-slate-900 cursor-pointer hover:bg-slate-900 transition-all select-none group"
                        >
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full overflow-hidden border border-slate-800 shrink-0 group-hover:border-blue-500 transition-all">
                                    <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${currentProfile.avatarSeed}`} alt={currentProfile.name[0]} className="w-full h-full" />
                                </div>
                                <div className="overflow-hidden flex-1">
                                    <p className="text-xs font-bold text-slate-100 uppercase tracking-tight truncate group-hover:text-blue-400 transition-all">{currentProfile.name}</p>
                                    <div className="flex items-center justify-between mt-0.5">
                                        <p className="text-[9px] text-slate-500 font-bold uppercase truncate">{currentProfile.role}</p>
                                        <span className="text-[8px] text-blue-500 font-bold uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-opacity">Changer</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right core applet wrapper */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Global workspace header */}
                        <header className="h-16 border-b border-slate-900 bg-slate-950/40 px-4 md:px-6 flex items-center justify-between shrink-0 relative z-10">
                            <div className="flex items-center gap-2">
                                {/* Hamburger Menu button for Smartphones */}
                                <button 
                                    onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} 
                                    className="p-1.5 text-slate-400 hover:text-slate-100 md:hidden rounded hover:bg-slate-900 flex items-center justify-center"
                                    aria-label="Ouvrir le menu"
                                    id="hamburger-btn"
                                >
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <line x1="3" y1="12" x2="21" y2="12" />
                                        <line x1="3" y1="6" x2="21" x2="6" />
                                        <line x1="3" y1="18" x2="21" y2="18" />
                                    </svg>
                                </button>
                                
                                <h2 className="text-xs font-black text-slate-100 uppercase tracking-widest flex items-center gap-2">
                                    <div className="w-1.5 h-1.5 rounded-full bg-blue-500" />
                                    {viewTitles[view]}
                                </h2>
                            </div>

                            <div className="flex items-center gap-6">
                                <div className="text-right hidden sm:block">
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest leading-none">Valeur Active</p>
                                    <p className="text-sm font-bold font-mono text-blue-500 mt-0.5">{stats.pipelineValue.toLocaleString()} €</p>
                                </div>
                                <button 
                                    onClick={handleDownloadGlobalReportPDF}
                                    className="bg-slate-100 hover:bg-slate-200 text-slate-950 font-bold text-[9px] uppercase tracking-widest px-3 md:px-4 py-1.5 rounded flex items-center gap-1.5 transition-all shadow-lg"
                                >
                                    <Icon name="Download" size={11} /> <span className="hidden xs:inline">Rapport .PDF</span><span className="xs:hidden">.PDF</span>
                                </button>
                            </div>
                        </header>

                        {/* Views Content area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-6 relative z-10">
                            {view === 'dashboard' && <DashboardView />}
                            {view === 'leads' && <LeadsView />}
                            {view === 'clients' && <ClientsView />}
                            {view === 'invoices' && <InvoicesView />}
                            {view === 'actions' && <ActionsView />}
                            {view === 'statistics' && <StatisticsView />}
                        </main>
                    </div>

                    {/* Modals structures */}
                    {isLeadModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-[1px]" onClick={() => setIsLeadModalOpen(false)} />
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-6 relative z-10 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="text-xs font-black uppercase tracking-widest text-slate-200">Créer une Opportunité</h3>
                                    <button onClick={() => setIsLeadModalOpen(false)} className="text-slate-500 hover:text-white"><Icon name="X" size={16} /></button>
                                </div>
                                <form onSubmit={handleAddLeadSubmit} className="space-y-4 text-xs">
                                    <div>
                                        <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Nom de l'entreprise</label>
                                        <input type="text" value={newLeadCompany} onChange={(e) => setNewLeadCompany(e.target.value)} required className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2.5 text-slate-200 font-bold text-xs" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Contact</label>
                                            <input type="text" value={newLeadContact} onChange={(e) => setNewLeadContact(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2.5 text-slate-200 text-xs" />
                                        </div>
                                        <div>
                                            <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Email</label>
                                            <input type="email" value={newLeadEmail} onChange={(e) => setNewLeadEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2.5 text-slate-200 text-xs" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Cahier des charges / Enjeux</label>
                                        <textarea value={newLeadNeed} onChange={(e) => setNewLeadNeed(e.target.value)} required className="w-full bg-slate-950 border border-slate-800 rounded h-16 p-2 text-slate-200 text-xs resize-none" rows="2" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Budget prév.</label>
                                            <input type="number" value={newLeadBudget} onChange={(e) => setNewLeadBudget(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2.5 text-slate-200 font-bold" />
                                        </div>
                                        <div>
                                            <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">T°</label>
                                            <select value={newLeadTemp} onChange={(e) => setNewLeadTemp(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-1.5 text-slate-200 font-black uppercase">
                                                <option value="Chaud">Chaud</option>
                                                <option value="Tiède">Tiède</option>
                                                <option value="Froid">Froid</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Pôle</label>
                                            <select value={newLeadService} onChange={(e) => setNewLeadService(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-1.5 text-slate-200 font-bold">
                                                <option value="Web">Web</option>
                                                <option value="SEO">SEO</option>
                                                <option value="Design">Design</option>
                                                <option value="Consulting">Consulting</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full py-2 bg-blue-600 hover:bg-blue-700 font-bold uppercase tracking-widest text-[9px] rounded">Injecter en CRM</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isActionModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-[1px]" onClick={() => setIsActionModalOpen(false)} />
                            <div className="bg-slate-900 border border-slate-800 rounded-lg p-6 relative z-10 w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="text-xs font-black uppercase tracking-widest text-slate-200">Ajouter une Tâche</h3>
                                    <button onClick={() => setIsActionModalOpen(false)} className="text-slate-500 hover:text-white"><Icon name="X" size={16} /></button>
                                </div>
                                <form onSubmit={handleAddActionSubmit} className="space-y-4 text-xs">
                                    <div>
                                        <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Description</label>
                                        <input type="text" value={newActionText} onChange={(e) => setNewActionText(e.target.value)} required className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2.5 text-slate-200" />
                                    </div>
                                    <div>
                                        <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Attribuer à</label>
                                        <select value={newActionLead} onChange={(e) => setNewActionLead(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2 text-slate-200 font-semibold uppercase">
                                            <option value="">Général / Aucun client</option>
                                            {leads.map(l => (
                                                <option key={l.id} value={l.id}>{l.companyName}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[9px] text-slate-400 uppercase font-black tracking-wider block mb-1">Date d'échéance</label>
                                        <input type="date" value={newActionDate} onChange={(e) => setNewActionDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded h-8 px-2.5 text-slate-200 font-mono" />
                                    </div>
                                    <button type="submit" className="w-full py-2 bg-blue-600 hover:bg-blue-700 font-bold uppercase tracking-widest text-[9px] rounded">Enregistrer la tâche</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isProfileSwitcherOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-[1px]" onClick={() => setIsProfileSwitcherOpen(false)} />
                            <div className="bg-slate-900 border border-slate-850 rounded-lg p-6 relative z-10 w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <div>
                                        <h3 className="text-xs font-black uppercase tracking-widest text-slate-200">Session en Cours</h3>
                                        <p className="text-[8px] text-slate-500 font-bold uppercase mt-0.5">Membres autorisés de l'agence</p>
                                    </div>
                                    <button onClick={() => setIsProfileSwitcherOpen(false)} className="text-slate-500 hover:text-white"><Icon name="X" size={16} /></button>
                                </div>
                                <div className="space-y-3">
                                    {AGENT_PROFILES.map(prof => {
                                        const isAct = prof.id === currentProfile.id;
                                        return (
                                            <button 
                                                key={prof.id}
                                                onClick={() => {
                                                    setCurrentProfile(prof);
                                                    setIsProfileSwitcherOpen(false);
                                                }}
                                                className={`w-full text-left p-3.5 rounded-lg border flex items-center gap-3 transition-colors ${
                                                    isAct ? 'bg-blue-600/10 border-blue-500/50' : 'bg-slate-950/40 border-slate-850 hover:bg-slate-850/50'
                                                }`}
                                            >
                                                <div className="w-8 h-8 rounded-full overflow-hidden shrink-0 bg-slate-800">
                                                    <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${prof.avatarSeed}`} alt={prof.name} className="w-full h-full" />
                                                </div>
                                                <div className="flex-1 overflow-hidden">
                                                    <p className="text-xs font-black text-slate-200 uppercase tracking-tight truncate">{prof.name}</p>
                                                    <p className="text-[9px] text-slate-500 font-black uppercase tracking-wide mt-0.5">{prof.role}</p>
                                                </div>
                                                {isAct && <div className="w-2 h-2 rounded-full bg-blue-500" />}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
