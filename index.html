<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITECRM CABINET - Production Agence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { slate: { 950: '#070a13', 900: '#0b0f19', 800: '#111827', 700: '#1f2937' } }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070a13; }
        .active-menu { background-color: rgba(30, 41, 59, 0.5); color: #3b82f6; border-left: 4px solid #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#070a13] text-slate-100 antialiased min-h-screen">

    <div id="login-screen" class="fixed inset-0 bg-[#070a13] z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-[#0b0f19] border border-slate-800 p-8 rounded-2xl max-w-sm w-full text-center space-y-6 shadow-2xl">
            <div>
                <span class="font-bold text-xl text-white tracking-wide block">ELITECRM CABINET</span>
                <span class="text-[10px] text-blue-500 uppercase tracking-widest font-semibold">Portail d'authentification</span>
            </div>
            <div class="space-y-3 text-left">
                <label class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Sélectionner un profil</label>
                <select id="login-user-select" class="w-full bg-[#070a13] border border-slate-700 rounded-lg p-3 text-xs text-white">
                    <option value="LÉA JOLY|CHEF DE PROJET SENIOR">Léa Joly (Chef de Projet)</option>
                    <option value="DIRECTEUR AGENCE|ADMINISTRATEUR">Directeur Agence (Admin)</option>
                </select>
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-lg tracking-wider uppercase transition">
                Se connecter
            </button>
        </div>
    </div>

    <div class="lg:hidden flex items-center justify-between p-4 bg-[#0b0f19] border-b border-slate-800/60 fixed top-0 left-0 right-0 z-50">
        <div class="flex flex-col">
            <span class="font-bold text-sm text-white tracking-wide">ELITECRM CABINET</span>
            <span class="text-[9px] text-slate-500 uppercase tracking-widest">Production Agence</span>
        </div>
        <button onclick="toggleMenu()" class="p-2 text-slate-400 hover:text-white font-bold text-2xl focus:outline-none">☰</button>
    </div>

    <div class="flex min-h-screen relative">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-[#0b0f19] border-r border-slate-800/60 flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:h-screen pt-16 lg:pt-0">
            <div class="p-6 hidden lg:flex flex-col">
                <span class="font-bold text-md text-white tracking-wide">ELITECRM CABINET</span>
                <span class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Production Agence</span>
            </div>
            
            <nav class="flex-1 py-4 space-y-1 overflow-y-auto no-scrollbar">
                <button onclick="switchView('dashboard')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="dashboard">📊 TABLEAU DE BORD</button>
                <button onclick="switchView('opportunites')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="opportunites">👥 OPPORTUNITÉS</button>
                <button onclick="switchView('portefeuille')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="portefeuille">💼 PORTEFEUILLE</button>
                <button onclick="switchView('facturation')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="facturation">💳 FACTURATION</button>
                <button onclick="switchView('planning')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="planning">📅 PLANNING</button>
                <button onclick="switchView('statistiques')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="statistiques">📈 STATISTIQUES</button>
            </nav>

            <div class="p-4 border-t border-slate-800/40 bg-[#090d16] relative">
                <div id="profile-dropdown" class="absolute bottom-16 left-4 right-4 bg-[#0b0f19] border border-slate-800 rounded-xl shadow-2xl p-2 hidden z-50 space-y-1">
                    <button onclick="switchAccount('LÉA JOLY', 'CHEF DE PROJET SENIOR')" class="w-full text-left text-[11px] p-2 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center gap-2">
                        <span>👩‍💻</span> Léa Joly (Chef de Projet)
                    </button>
                    <button onclick="switchAccount('DIRECTEUR AGENCE', 'ADMINISTRATEUR')" class="w-full text-left text-[11px] p-2 rounded hover:bg-slate-800 text-slate-300 hover:text-white flex items-center gap-2">
                        <span>💼</span> Directeur Agence (Admin)
                    </button>
                    <div class="border-t border-slate-800 my-1"></div>
                    <button onclick="logoutAccount()" class="w-full text-left text-[11px] p-2 rounded hover:bg-red-950 text-red-400 flex items-center gap-2 font-bold">
                        <span>🚪</span> Se déconnecter...
                    </button>
                </div>

                <div class="flex items-center justify-between cursor-pointer p-1.5 rounded-lg hover:bg-slate-800/40" onclick="toggleProfileMenu()">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-sm font-bold">👤</div>
                        <div>
                            <p id="prof-name" class="text-xs font-bold text-slate-200 tracking-wide">LÉA JOLY</p>
                            <p id="prof-role" class="text-[9px] text-slate-500 tracking-wider font-medium uppercase mt-0.5">CHEF DE PROJET SENIOR</p>
                        </div>
                    </div>
                    <span class="text-slate-500 text-[10px]">▲</span>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

        <main class="flex-1 p-4 lg:p-8 overflow-x-hidden w-full pt-20 lg:pt-8">
            <div id="content-area" class="max-w-7xl mx-auto space-y-6"></div>
        </main>
    </div>

    <script>
        // --- DATA OBJECT INITIALIZATION FIRST ---
        let appsData = JSON.parse(localStorage.getItem('elite_crm_v3_store')) || {
            currentUser: { name: "LÉA JOLY", role: "CHEF DE PROJET SENIOR" },
            isLoggedOut: false,
            leads: [
                { id: 1, name: "ACME CORP", budget: "15 000 €", status: "Proposition" },
                { id: 2, name: "STARLIGHT AGENCY", budget: "5 000 €", status: "Gagné" },
                { id: 3, name: "GLOBALTECH LTD", budget: "8 500 €", status: "Prospect" }
            ],
            invoices: [
                { id: 1024, client: "ACME CORP", amount: "15 000 €", status: "ATTENTE" },
                { id: 1023, client: "STARLIGHT AGENCY", amount: "5 000 €", status: "PAYÉ" }
            ],
            tasks: [
                { id: 1, text: "Lancement de l'audit SEO technique", client: "STARLIGHT AGENCY", date: "2026-05-28", done: false },
                { id: 2, text: "Appel de suivi client pour devis", client: "GLOBALTECH LTD", date: "2026-05-29", done: false }
            ]
        };

        function syncData() {
            localStorage.setItem('elite_crm_v3_store', JSON.stringify(appsData));
        }

        // --- INTERACTIVE NAVIGATION AND UTILITIES DEFINITIONS ---
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function toggleProfileMenu() {
            document.getElementById('profile-dropdown').classList.toggle('hidden');
        }

        function switchAccount(name, role) {
            appsData.currentUser = { name, role };
            syncData();
            document.getElementById('prof-name').innerText = name;
            document.getElementById('prof-role').innerText = role;
            document.getElementById('profile-dropdown').classList.add('hidden');
            let activeNav = document.querySelector('.active-menu');
            if(activeNav) switchView(activeNav.getAttribute('data-view'));
        }

        function logoutAccount() {
            appsData.isLoggedOut = true;
            syncData();
            document.getElementById('profile-dropdown').classList.add('hidden');
            document.getElementById('login-screen').style.display = 'flex';
        }

        function handleLogin() {
            let select = document.getElementById('login-user-select').value.split('|');
            appsData.currentUser = { name: select[0], role: select[1] };
            appsData.isLoggedOut = false;
            syncData();
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('prof-name').innerText = appsData.currentUser.name;
            document.getElementById('prof-role').innerText = appsData.currentUser.role;
            switchView('dashboard');
        }

        function toggleTask(id) {
            let task = appsData.tasks.find(t => t.id === id);
            if(task) {
                task.done = !task.done;
                syncData();
                let activeNav = document.querySelector('.active-menu');
                if(activeNav) switchView(activeNav.getAttribute('data-view'));
            }
        }

        function editBudget(index) {
            let newBudget = prompt("Modifier le montant du budget pour " + appsData.leads[index].name + " :", appsData.leads[index].budget);
            if(newBudget !== null && newBudget.trim() !== "") {
                appsData.leads[index].budget = newBudget.trim();
                syncData();
                switchView('opportunites');
            }
        }

        function addLeadPrompt() {
            let name = prompt("Nom de l'entreprise :");
            let budget = prompt("Budget estimé (ex: 12 000 €) :");
            if(name && budget) {
                appsData.leads.push({ id: Date.now(), name: name.toUpperCase(), budget, status: "Prospect" });
                syncData(); switchView('opportunites');
            }
        }

        function updateLeadStatus(index, status) {
            appsData.leads[index].status = status;
            syncData();
        }

        function addInvoicePrompt() {
            let client = prompt("Nom du client à facturer :");
            let amount = prompt("Montant (ex: 4 200 €) :");
            if(client && amount) {
                appsData.invoices.push({ id: Math.floor(1000 + Math.random() * 9000), client: client.toUpperCase(), amount, status: "ATTENTE" });
                syncData(); switchView('facturation');
            }
        }

        function updateInvoiceStatus(index, status) {
            appsData.invoices[index].status = status;
            syncData();
        }

        function addTaskPrompt() {
            let text = prompt("Intitulé du rendez-vous / de la tâche :");
            let client = prompt("Client concerné :");
            if(text && client) {
                appsData.tasks.push({ id: Date.now(), text, client: client.toUpperCase(), date: "2026-05-29", done: false });
                syncData(); switchView('planning');
            }
        }

        // --- VIEW CONTROLLER ---
        function switchView(viewName) {
            const content = document.getElementById('content-area');
            if(!document.getElementById('sidebar').classList.contains('-translate-x-full')) toggleMenu();

            document.querySelectorAll('.nav-item').forEach(item => {
                if(item.getAttribute('data-view') === viewName) {
                    item.className = "nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-blue-500 bg-[#1e293b]/40 border-l-4 border-blue-500 active-menu";
                } else {
                    item.className = "nav-item w-full flex items-center gap-3 px-6 py-3 text-xs font-bold tracking-wider text-slate-400 hover:bg-slate-800/30 hover:text-slate-200";
                }
            });

            if(viewName === 'dashboard') {
                let pipeTotal = appsData.leads.reduce((acc, curr) => acc + parseInt(curr.budget.replace(/[^0-9]/g, '') || 0), 0);
                let gagneCount = appsData.leads.filter(l => l.status === 'Gagné').length;
                let totalEncaisse = appsData.invoices.filter(i => i.status === 'PAYÉ').reduce((acc, curr) => acc + parseInt(curr.amount.replace(/[^0-9]/g, '') || 0), 0);

                let tasksHTML = appsData.tasks.map(t => `
                    <div class="p-3 bg-[#070a13] border border-slate-800/40 rounded-lg flex items-start gap-3">
                        <input type="checkbox" onchange="toggleTask(${t.id})" ${t.done ? 'checked' : ''} class="mt-0.5 rounded bg-slate-800 border-slate-700">
                        <div>
                            <p class="text-xs font-semibold ${t.done ? 'line-through text-slate-500' : 'text-white'}">${t.text}</p>
                            <p class="text-[9px] text-slate-500 uppercase mt-0.5">${t.client} • ${t.date}</p>
                        </div>
                    </div>
                `).join('');

                let invoicesHTML = appsData.invoices.map(i => `
                    <div class="p-3 bg-[#070a13] border border-slate-800/40 rounded-lg flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold text-white">${i.client}</p>
                            <p class="text-[9px] text-slate-500 uppercase mt-0.5">INV-${i.id}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-white">${i.amount}</p>
                            <span class="text-[8px] font-bold ${i.status === 'PAYÉ' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-amber-500/10 text-amber-500'} px-1.5 py-0.5 rounded border block mt-1">${i.status}</span>
                        </div>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800/40 pb-4">
                        <div class="flex items-center gap-2 text-blue-500 font-bold text-xs uppercase tracking-wider">
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> TABLEAU DE BORD
                        </div>
                        <button onclick="downloadPDFReport()" class="bg-white text-slate-950 font-bold text-xs px-3 py-1.5 rounded border border-slate-200 self-start sm:self-auto">.PDF</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-[#0b0f19]/80 border border-slate-800/60 p-5 rounded-xl"><p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">VALEUR PIPELINE</p><p class="text-2xl font-bold text-white mt-1">${pipeTotal.toLocaleString()} €</p></div>
                        <div class="bg-[#0b0f19]/80 border border-slate-800/60 p-5 rounded-xl"><p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">CLIENTS GAGNÉS</p><p class="text-2xl font-bold text-white mt-1">${gagneCount}</p></div>
                        <div class="bg-[#0b0f19]/80 border border-slate-800/60 p-5 rounded-xl"><p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">OPPORTUNITÉS TOTALES</p><p class="text-2xl font-bold text-white mt-1">${appsData.leads.length}</p></div>
                        <div class="bg-[#0b0f19]/80 border border-slate-800/60 p-5 rounded-xl"><p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">TOTAL ENCAISSÉ</p><p class="text-2xl font-bold text-white mt-1">${totalEncaisse.toLocaleString()} €</p></div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-[#0b0f19]/80 border border-slate-800/60 p-5 rounded-xl lg:col-span-2 space-y-4">
                            <h3 class="text-xs font-bold text-slate-300 uppercase">🗓 ACTIONS RÉCENTES (À COCHER)</h3>
                            <div class="space-y-3">${tasksHTML}</div>
                        </div>
                        <div class="bg-[#0b0f19]/80 border border-slate-800/60 p-5 rounded-xl space-y-4">
                            <h3 class="text-xs font-bold text-slate-300 uppercase">💰 ÉMISSIONS COMPTABLES</h3>
                            <div class="space-y-3">${invoicesHTML}</div>
                        </div>
                    </div>
                `;
            } else if(viewName === 'opportunites') {
                let rows = appsData.leads.map((l, index) => `
                    <tr class="hover:bg-slate-800/20 border-b border-slate-800/50">
                        <td class="p-4 font-semibold text-white">${l.name}</td>
                        <td class="p-4 font-mono text-slate-300 flex items-center justify-between">
                            <span>${l.budget}</span>
                            <button onclick="editBudget(${index})" class="text-blue-500 hover:text-blue-400 font-bold text-sm px-2">✏️ Modifier</button>
                        </td>
                        <td class="p-4">
                            <select onchange="updateLeadStatus(${index}, this.value)" class="bg-[#070a13] text-xs text-slate-300 border border-slate-700 rounded px-2 py-1 focus:outline-none">
                                <option value="Prospect" ${l.status==='Prospect'?'selected':''}>Prospect</option>
                                <option value="Proposition" ${l.status==='Proposition'?'selected':''}>Proposition</option>
                                <option value="Gagné" ${l.status==='Gagné'?'selected':''}>Gagné</option>
                            </select>
                        </td>
                    </tr>
                `).join('');

                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="text-blue-500 font-bold text-xs uppercase tracking-wider">👥 OPPORTUNITÉS</div>
                        <button onclick="addLeadPrompt()" class="text-[10px] font-bold bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700">+ AJOUTER</button>
                    </div>
                    <div class="bg-[#0b0f19]/80 border border-slate-800/60 rounded-xl overflow-hidden shadow-xl">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-[#070a13] text-slate-400 uppercase font-bold border-b border-slate-800">
                                <tr><th class="p-4">Entreprise</th><th class="p-4">Budget</th><th class="p-4">Statut</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/30">${rows}</tbody>
                        </table>
                    </div>
                `;
            } else if(viewName === 'portefeuille') {
                let col1 = appsData.leads.filter(l => l.status === 'Prospect').map(l => `<div class="p-3 bg-[#070a13] rounded-lg border border-slate-800 mb-2 font-semibold text-xs">${l.name} (${l.budget})</div>`).join('');
                let col2 = appsData.leads.filter(l => l.status === 'Proposition').map(l => `<div class="p-3 bg-[#070a13] rounded-lg border border-blue-900/40 mb-2 font-semibold text-xs text-blue-400">${l.name} (${l.budget})</div>`).join('');
                let col3 = appsData.leads.filter(l => l.status === 'Gagné').map(l => `<div class="p-3 bg-[#070a13] rounded-lg border border-emerald-900/40 mb-2 font-semibold text-xs text-emerald-400">${l.name} (${l.budget})</div>`).join('');

                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="text-blue-500 font-bold text-xs uppercase tracking-wider">💼 PORTEFEUILLE (KANBAN)</div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-[#0b0f19] p-4 rounded-xl border border-slate-800"><p class="text-[10px] text-slate-400 font-bold uppercase mb-3">📥 PROSPECTS</p>${col1 || '<p class="text-[10px] text-slate-600 italic">Vide</p>'}</div>
                        <div class="bg-[#0b0f19] p-4 rounded-xl border border-slate-800"><p class="text-[10px] text-blue-400 font-bold uppercase mb-3">📝 PROPOSITIONS</p>${col2 || '<p class="text-[10px] text-slate-600 italic">Vide</p>'}</div>
                        <div class="bg-[#0b0f19] p-4 rounded-xl border border-slate-800"><p class="text-[10px] text-emerald-400 font-bold uppercase mb-3">✅ GAGNÉS</p>${col3 || '<p class="text-[10px] text-slate-600 italic">Vide</p>'}</div>
                    </div>
                `;
            } else if(viewName === 'facturation') {
                let rows = appsData.invoices.map((i, idx) => `
                    <div class="p-4 bg-[#0b0f19] border border-slate-800 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-white">${i.client} - INV-${i.id}</p>
                            <p class="text-slate-500 mt-1">Montant : <span class="text-white font-medium">${i.amount}</span></p>
                        </div>
                        <div class="flex items-center gap-3">
                            <select onchange="updateInvoiceStatus(${idx}, this.value)" class="bg-[#070a13] text-slate-300 border border-slate-700 rounded p-1 focus:outline-none">
                                <option value="ATTENTE" ${i.status==='ATTENTE'?'selected':''}>ATTENTE</option>
                                <option value="PAYÉ" ${i.status==='PAYÉ'?'selected':''}>PAYÉ</option>
                            </select>
                            <button onclick="downloadSingleInvoice(${i.id}, '${i.client}', '${i.amount}', '${i.status}')" class="bg-slate-800 border border-slate-700 text-slate-200 px-3 py-1 rounded text-xs font-bold hover:bg-slate-700">Télécharger PDF</button>
                        </div>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="text-blue-500 font-bold text-xs uppercase tracking-wider">💳 FACTURATION</div>
                        <button onclick="addInvoicePrompt()" class="text-[10px] font-bold bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700">+ FACTURER</button>
                    </div>
                    <div class="space-y-3">${rows}</div>
                `;
            } else if(viewName === 'planning') {
                let list = appsData.tasks.map(t => `
                    <div class="p-4 bg-[#0b0f19] border border-slate-800 rounded-xl flex justify-between items-center text-xs">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" onchange="toggleTask(${t.id})" ${t.done ? 'checked' : ''} class="rounded bg-slate-800 border-slate-700">
                            <div>
                                <p class="font-semibold ${t.done ? 'line-through text-slate-500' : 'text-white'}">${t.text}</p>
                                <p class="text-slate-500 text-[10px] mt-0.5">${t.client}</p>
                            </div>
                        </div>
                        <span class="text-[10px] text-slate-400 bg-[#070a13] border border-slate-800 px-2 py-0.5 rounded">${t.date}</span>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="text-blue-500 font-bold text-xs uppercase tracking-wider">📅 PLANNING / AGENDA</div>
                        <button onclick="addTaskPrompt()" class="text-[10px] font-bold bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700">+ PLANIFIER</button>
                    </div>
                    <div class="space-y-3">${list}</div>
                `;
            } else if(viewName === 'statistiques') {
                // --- GRAPHIQUE ULTRA PREMIUM CONNECTÉ ---
                let maxBudget = 25000;
                let barsHTML = appsData.leads.map(l => {
                    let numericalValue = parseInt(l.budget.replace(/[^0-9]/g, '') || 0);
                    let percentage = (numericalValue / maxBudget) * 100;
                    
                    let colorClass = "from-blue-600 to-indigo-500";
                    if(l.status === 'Gagné') colorClass = "from-emerald-600 to-teal-500";
                    if(l.status === 'Prospect') colorClass = "from-slate-700 to-slate-500";

                    return `
                        <div class="flex flex-col items-center flex-1 group">
                            <div class="w-full sm:w-16 h-64 bg-slate-900/40 border border-slate-800/60 rounded-t-xl flex items-end justify-center relative p-0.5">
                                <div class="w-full rounded-t-lg bg-gradient-to-t ${colorClass} transition-all duration-700 shadow-md group-hover:brightness-125" style="height: ${percentage}%;"></div>
                                <span class="absolute -top-7 bg-[#111827] border border-slate-700 text-white font-mono font-bold text-[10px] px-2 py-0.5 rounded shadow-xl">${numericalValue.toLocaleString()} €</span>
                            </div>
                            <p class="text-[10px] font-bold text-slate-300 mt-3 truncate max-w-[80px]">${l.name}</p>
                            <p class="text-[8px] text-slate-500 uppercase mt-0.5">${l.status}</p>
                        </div>
                    `;
                }).join('');

                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="text-blue-500 font-bold text-xs uppercase tracking-wider">📈 STATISTIQUES FINANCIÈRES</div>
                    </div>
                    <div class="bg-[#0b0f19] border border-slate-800 p-6 rounded-2xl shadow-2xl relative">
                        <div class="flex items-center justify-between mb-8">
                            <div>
                                <h4 class="text-xs font-bold text-white uppercase tracking-wider">Analyse des Budgets par Affaire</h4>
                                <p class="text-[10px] text-slate-500 mt-1">Mise à jour dynamique à chaque modification de budget</p>
                            </div>
                            <div class="flex gap-4 text-[8px] font-bold uppercase">
                                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-emerald-500"></span> Gagné</div>
                                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-blue-500"></span> Proposition</div>
                                <div class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-slate-500"></span> Prospect</div>
                            </div>
                        </div>
                        <div class="relative pt-4">
                            <div class="absolute inset-x-0 bottom-0 top-4 flex flex-col justify-between pointer-events-none opacity-20 text-[9px] text-slate-500 font-mono">
                                <div class="border-b border-slate-700 w-full pb-1 text-right">25 000 €</div>
                                <div class="border-b border-slate-700 w-full pb-1 text-right">15 000 €</div>
                                <div class="border-b border-slate-700 w-full pb-1 text-right">5 000 €</div>
                                <div class="w-full text-right">0 €</div>
                            </div>
                            <div class="flex items-end justify-around gap-4 h-64 border-b border-slate-800 relative z-10 pb-1">
                                ${barsHTML}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // --- PDF ENGINE ---
        function downloadPDFReport() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("Helvetica", "bold"); doc.text("ELITECRM CABINET - REVENUE REPORT", 14, 20);
            doc.setFont("Helvetica", "normal"); doc.setFontSize(10);
            doc.text("Généré le : " + new Date().toLocaleDateString(), 14, 28);
            let y = 45;
            appsData.leads.forEach(l => {
                doc.text(`- Client: ${l.name} | Budget: ${l.budget} | Statut: ${l.status}`, 14, y);
                y += 10;
            });
            doc.save("rapport-general.pdf");
        }

        function downloadSingleInvoice(id, client, amount, status) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("Helvetica", "bold"); doc.text(`FACTURE N°${id}`, 14, 20);
            doc.setFont("Helvetica", "normal"); doc.setFontSize(11);
            doc.text(`Client : ${client}`, 14, 35);
            doc.text(`Montant : ${amount}`, 14, 45);
            doc.text(`Statut : ${status}`, 14, 55);
            doc.save(`facture-${id}.pdf`);
        }

        // --- SESSION EXECUTION ---
        initSession();
        switchView('dashboard');
    </script>
</body>
</html>
