<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCRM Cabinet - Production Agence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#070a13',
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#4b5563',
                            500: '#6b7280'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-menu { background-color: #1e293b; color: #3b82f6; border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-[#070a13] text-slate-100 antialiased font-sans min-h-screen">

    <div class="lg:hidden flex items-center justify-between p-4 bg-[#0b0f19] border-b border-slate-800 sticky top-0 z-50">
        <div class="flex flex-col">
            <span class="font-display font-bold text-md text-white tracking-wide">ELITECRM CABINET</span>
            <span class="text-[10px] text-slate-500 uppercase tracking-widest">Production Agence</span>
        </div>
        <button id="mobile-menu-btn" class="p-2 text-slate-400 hover:text-white focus:outline-none">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

    <div class="flex min-h-screen relative">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-[#0b0f19] border-r border-slate-800/60 flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:h-screen">
            <div class="p-6 hidden lg:flex flex-col border-b border-slate-800/40">
                <span class="font-display font-bold text-lg text-white tracking-wide">ELITECRM CABINET</span>
                <span class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Production Agence</span>
            </div>
            
            <nav class="flex-1 py-4 space-y-1 overflow-y-auto no-scrollbar">
                <button onclick="switchView('dashboard')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="dashboard">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> TABLEAU DE BORD
                </button>
                <button onclick="switchView('opportunites')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="opportunites">
                    <i data-lucide="users" class="w-4 h-4"></i> OPPORTUNITÉS
                </button>
                <button onclick="switchView('portefeuille')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="portefeuille">
                    <i data-lucide="folder-kanban" class="w-4 h-4"></i> PORTEFEUILLE
                </button>
                <button onclick="switchView('facturation')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="facturation">
                    <i data-lucide="credit-card" class="w-4 h-4"></i> FACTURATION
                </button>
                <button onclick="switchView('planning')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="planning">
                    <i data-lucide="calendar" class="w-4 h-4"></i> PLANNING
                </button>
                <button onclick="switchView('statistiques')" class="nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200" data-view="statistiques">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> STATISTIQUES
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800/40 bg-[#090d16] relative">
                <div id="profile-dropdown" class="absolute bottom-20 left-4 right-4 bg-[#111827] border border-slate-800 p-2 rounded-xl shadow-2xl hidden z-50 space-y-1">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider px-2 py-1">Changer de compte</p>
                    <button onclick="changeUser('LÉA JOLY', 'CHEF DE PROJET SENIOR', '👩‍💻')" class="w-full text-left text-xs font-semibold px-2 py-2 rounded-lg hover:bg-slate-800 text-white flex items-center gap-2">
                        <span>👩‍💻</span> LÉA JOLY
                    </button>
                    <button onclick="changeUser('DIRECTEUR AGENCE', 'ADMINISTRATEUR', '💼')" class="w-full text-left text-xs font-semibold px-2 py-2 rounded-lg hover:bg-slate-800 text-slate-400 flex items-center gap-2">
                        <span>💼</span> LE BOSS
                    </button>
                </div>
                
                <div onclick="toggleProfileMenu()" class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-800/40 transition cursor-pointer border border-transparent hover:border-slate-800">
                    <div class="flex items-center gap-3 min-w-0">
                        <div id="user-avatar" class="w-8 h-8 rounded-full bg-orange-200 flex items-center justify-center text-sm shadow-md">👩‍💻</div>
                        <div class="min-w-0">
                            <p id="user-name" class="text-xs font-bold text-slate-200 tracking-wide truncate">LÉA JOLY</p>
                            <p id="user-role" class="text-[9px] text-slate-500 tracking-wider font-medium truncate uppercase mt-0.5">CHEF DE PROJET SENIOR</p>
                        </div>
                    </div>
                    <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-slate-500"></i>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden"></div>

        <main class="flex-1 p-4 lg:p-8 overflow-x-hidden w-full bg-[#070a13]">
            <div id="content-area" class="max-w-7xl mx-auto space-y-6"></div>
        </main>
    </div>

    <script>
        // Hamburger Menu Mobile
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleMobileMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        if(overlay) overlay.addEventListener('click', toggleMobileMenu);

        // Gestion Dropdown Profil
        function toggleProfileMenu() {
            document.getElementById('profile-dropdown').classList.toggle('hidden');
        }
        function changeUser(name, role, avatar) {
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-role').innerText = role;
            document.getElementById('user-avatar').innerText = avatar;
            toggleProfileMenu();
        }

        // Système d'onglets et de routage
        function switchView(viewName) {
            const content = document.getElementById('content-area');
            if(!sidebar.classList.contains('-translate-x-full')) toggleMobileMenu();

            // Classe active sur le menu courant
            document.querySelectorAll('.nav-item').forEach(item => {
                if(item.getAttribute('data-view') === viewName) {
                    item.className = "nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all active-menu";
                } else {
                    item.className = "nav-item w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/30 hover:text-slate-200";
                }
            });

            if(viewName === 'dashboard') {
                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="flex items-center gap-2 text-blue-500 font-bold text-sm uppercase tracking-wider">
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> TABLEAU DE BORD
                        </div>
                        <div class="text-right text-xs text-slate-400 font-semibold">
                            VALEUR ACTIVE : <span class="text-blue-400 font-bold text-sm">25 000 €</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-[#0b0f19] border border-slate-800/80 p-5 rounded-xl">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Valeur Pipeline</p>
                            <p class="text-2xl font-display font-bold text-white mt-1">25 000 €</p>
                            <p class="text-[10px] text-slate-500 uppercase font-medium mt-1">Dossiers qualifiés / Proposition</p>
                        </div>
                        <div class="bg-[#0b0f19] border border-slate-800/80 p-5 rounded-xl">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Clients Gagnés</p>
                            <p class="text-2xl font-display font-bold text-white mt-1">2</p>
                            <p class="text-[10px] text-slate-500 uppercase font-medium mt-1">Contrats signés actifs</p>
                        </div>
                        <div class="bg-[#0b0f19] border border-slate-800/80 p-5 rounded-xl">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Opportunités Totales</p>
                            <p class="text-2xl font-display font-bold text-white mt-1">3</p>
                            <p class="text-[10px] text-slate-500 uppercase font-medium mt-1">Prospects en base CRM</p>
                        </div>
                        <div class="bg-[#0b0f19] border border-slate-800/80 p-5 rounded-xl">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Encaissé</p>
                            <p class="text-2xl font-display font-bold text-white mt-1">5 000 €</p>
                            <p class="text-[10px] text-slate-500 uppercase font-medium mt-1">Sécurisé via factures payées</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-[#0b0f19] border border-slate-800/80 p-5 rounded-xl lg:col-span-2">
                            <h3 class="text-xs font-bold tracking-wider text-slate-300 uppercase mb-4 flex items-center gap-2"><i data-lucide="check-square" class="w-3.5 h-3.5 text-blue-500"></i> Actions Récentes</h3>
                            <div class="space-y-3">
                                <div class="p-3 bg-[#070a13] border border-slate-800/50 rounded-lg flex items-center gap-3">
                                    <input type="checkbox" class="rounded bg-slate-800 border-slate-700">
                                    <div>
                                        <p class="text-xs font-semibold text-white">Lancement de l'audit SEO technique</p>
                                        <p class="text-[9px] text-slate-500 uppercase font-medium mt-0.5">Starlight Agency • 2026-05-28</p>
                                    </div>
                                </div>
                                <div class="p-3 bg-[#070a13] border border-slate-800/50 rounded-lg flex items-center gap-3">
                                    <input type="checkbox" class="rounded bg-slate-800 border-slate-700">
                                    <div>
                                        <p class="text-xs font-semibold text-white">Appel de suivi client pour devis</p>
                                        <p class="text-[9px] text-slate-500 uppercase font-medium mt-0.5">GlobalTech Ltd • 2026-05-29</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#0b0f19] border border-slate-800/80 p-5 rounded-xl">
                            <h3 class="text-xs font-bold tracking-wider text-slate-300 uppercase mb-4 flex items-center gap-2"><i data-lucide="dollar-sign" class="w-3.5 h-3.5 text-emerald-500"></i> Émissions Comptables</h3>
                            <div class="space-y-3">
                                <div class="p-3 bg-[#070a13] border border-slate-800/50 rounded-lg flex justify-between items-center">
                                    <div>
                                        <p class="text-xs font-bold text-white">ACME CORP</p>
                                        <p class="text-[9px] text-slate-500 uppercase mt-0.5">Échéance : 2026-06-15</p>
                                    </div>
                                    <span class="text-[9px] font-bold bg-amber-500/10 text-amber-500 px-2 py-0.5 rounded border border-amber-500/20">ATTENTE</span>
                                </div>
                                <div class="p-3 bg-[#070a13] border border-slate-800/50 rounded-lg flex justify-between items-center">
                                    <div>
                                        <p class="text-xs font-bold text-white">STARLIGHT AGENCY</p>
                                        <p class="text-[9px] text-slate-500 uppercase mt-0.5">Échéance : 2026-05-20</p>
                                    </div>
                                    <span class="text-[9px] font-bold bg-emerald-500/10 text-emerald-500 px-2 py-0.5 rounded border border-emerald-500/20">PAYÉ</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Pages de contenu génériques reprenant la structure
                content.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/40 pb-4">
                        <div class="flex items-center gap-2 text-blue-500 font-bold text-sm uppercase tracking-wider">
                            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> ${viewName.toUpperCase()}
                        </div>
                        <button onclick="switchView('dashboard')" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg">
                            <i data-lucide="arrow-left" class="w-3 h-3"></i> Retour Accueil
                        </button>
                    </div>
                    <div class="bg-[#0b0f19] border border-slate-800/80 p-6 rounded-xl">
                        <p class="text-sm text-slate-400">Contenu en cours de synchronisation pour l'onglet <span class="text-white font-semibold uppercase">${viewName}</span>.</p>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // Premier chargement par défaut sur le Tableau de bord
        switchView('dashboard');
    </script>
</body>
</html>
