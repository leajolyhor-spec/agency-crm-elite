<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteCRM - Production Cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#0b0f19',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                            500: '#64748b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        .ambient-glow {
            box-shadow: 0 0 50px -10px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen">

    <div class="lg:hidden flex items-center justify-between p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-between p-1.5 shadow-lg shadow-blue-500/20">
                <i data-lucide="layers" class="w-full h-full text-white"></i>
            </div>
            <span class="font-display font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Agency Elite</span>
        </div>
        <button id="mobile-menu-btn" class="p-2 text-slate-400 hover:text-white focus:outline-none">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

    <div class="flex min-h-screen relative">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:h-screen">
            <div class="p-6 hidden lg:flex items-center gap-3 border-b border-slate-800/50">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center p-2 shadow-lg shadow-blue-500/20">
                    <i data-lucide="layers" class="w-full h-full text-white"></i>
                </div>
                <span class="font-display font-bold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Agency Elite</span>
            </div>
            
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <button onclick="switchView('dashboard')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 bg-blue-600/10 text-blue-400 border border-blue-500/20" data-view="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Tableau de bord
                </button>
                <button onclick="switchView('leads')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200" data-view="leads">
                    <i data-lucide="users" class="w-5 h-5"></i> Opportunités
                </button>
                <button onclick="switchView('invoices')" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200" data-view="invoices">
                    <i data-lucide="file-text" class="w-5 h-5"></i> Facturation
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800/50 bg-slate-900/50">
                <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800/30 transition-all duration-200 cursor-pointer" onclick="toggleProfileMenu()">
                    <div id="current-avatar" class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-inner">LM</div>
                    <div class="flex-1 min-w-0">
                        <p id="current-name" class="text-sm font-semibold text-slate-200 truncate">Léa Joly</p>
                        <p id="current-role" class="text-xs text-slate-400 truncate">Chef de Projet Senior</p>
                    </div>
                    <i data-lucide="chevron-up" class="w-4 h-4 text-slate-500"></i>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

        <main class="flex-1 p-4 lg:p-8 overflow-x-hidden w-full">
            <div id="content-area" class="max-w-7xl mx-auto space-y-6">
                <h1 class="text-2xl lg:text-3xl font-display font-bold text-white">Bienvenue sur Agency Elite</h1>
                <p class="text-slate-400">Sélectionnez un onglet dans le menu pour commencer.</p>
            </div>
        </main>
    </div>

    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Mobile Menu Handling
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleMobileMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if(mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        if(overlay) overlay.addEventListener('click', toggleMobileMenu);

        // Simple Routing view switcher
        function switchView(viewName) {
            const content = document.getElementById('content-area');
            
            // Fermer le menu mobile si ouvert
            if(!sidebar.classList.contains('-translate-x-full')) {
                toggleMobileMenu();
            }

            // Mettre à jour les classes actives de la navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                if(item.getAttribute('data-view') === viewName) {
                    item.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 bg-blue-600/10 text-blue-400 border border-blue-500/20";
                } else {
                    item.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200";
                }
            });

            if(viewName === 'dashboard') {
                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl ambient-glow">
                            <p class="text-slate-400 text-sm font-medium">Chiffre d'Affaires</p>
                            <p class="text-3xl font-display font-bold mt-2 text-white">48 250 €</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <p class="text-slate-400 text-sm font-medium">Opportunités Actives</p>
                            <p class="text-3xl font-display font-bold mt-2 text-white">12</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <p class="text-slate-400 text-sm font-medium">Taux de Conversion</p>
                            <p class="text-3xl font-display font-bold mt-2 text-white">68%</p>
                        </div>
                    </div>
                `;
            } else if(viewName === 'leads') {
                content.innerHTML = `
                    <h2 class="text-2xl font-display font-bold text-white mb-4">Opportunités Commerciales</h2>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-800 bg-slate-900/50">
                                    <th class="p-4 text-slate-400 font-medium text-sm">Entreprise</th>
                                    <th class="p-4 text-slate-400 font-medium text-sm">Budget</th>
                                    <th class="p-4 text-slate-400 font-medium text-sm">Statut</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                                <tr>
                                    <td class="p-4 text-white font-medium">Acme Corp</td>
                                    <td class="p-4 text-slate-300">15 000 €</td>
                                    <td class="p-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Proposition</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            } else if(viewName === 'invoices') {
                content.innerHTML = `
                    <h2 class="text-2xl font-display font-bold text-white mb-4">Facturation</h2>
                    <p class="text-slate-400 mb-4">Historique des factures de l'agence.</p>
                    <button onclick="generatePDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl inline-flex items-center gap-2 transition-all duration-200">
                        <i data-lucide="download" class="w-4 h-4"></i> Générer un rapport PDF
                    </button>
                `;
            }
            lucide.createIcons();
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Rapport d'Activité - Agency Elite", 10, 10);
            doc.text("Chiffre d'affaires global: 48 250 EUR", 10, 20);
            doc.save("rapport-agency-elite.pdf");
        }

        // Chargement initial
        switchView('dashboard');
    </script>
</body>
</html>
